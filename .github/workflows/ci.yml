name: ci

# One Linux job per pull request keeps CI minutes low. macOS is covered by local runs; Windows tests run with each
# release (release.yml). Pushes to main are not re-tested: main only changes through tested pull requests.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet, also for Windows and macOS
        run: go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Tests
        run: go test -race -count=1 ./...
      - name: Fuzz the validators
        run: go test -run '^$' -fuzz FuzzValidators -fuzztime 20s ./internal/detectors/
      - id: dirty
        name: Action finds the synthetic card and fails
        uses: ./
        continue-on-error: true
        with:
          path: testdata/action
          sarif: ato.sarif
      - name: Action outcome
        env:
          OUTCOME: ${{ steps.dirty.outcome }}
          FINDINGS: ${{ steps.dirty.outputs.findings }}
        run: |
          test "$OUTCOME" = failure
          test "$FINDINGS" = 1
          python3 -c 'import json; d=json.load(open("ato.sarif")); assert d["version"] == "2.1.0" and len(d["runs"][0]["results"]) == 1'
      - id: clean
        name: Action passes a clean folder
        uses: ./
        with:
          path: internal/domain
      - name: Clean outcome
        env:
          FINDINGS: ${{ steps.clean.outputs.findings }}
        run: test "$FINDINGS" = 0
