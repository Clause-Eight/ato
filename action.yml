name: pii-eu
description: Find EU personal data (national IDs, IBANs, cards) in the repository, confirmed by check digits.
author: Clause Eight

inputs:
  path:
    description: Folder to scan, relative to the workspace.
    default: "."
  min-confidence:
    description: Report findings at or above this confidence (low, medium or high).
    default: medium
  fail-on-findings:
    description: Fail the step when there are findings.
    default: "true"
  sarif:
    description: Write a SARIF file to this path (for GitHub code scanning, which needs GitHub Advanced Security on private repositories).
    default: ""

outputs:
  findings:
    description: Number of findings.
    value: ${{ steps.scan.outputs.findings }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Build pii-eu from this action's pinned source
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -trimpath -o "$RUNNER_TEMP/pii-eu" ./cmd/pii-eu

    - id: scan
      name: Scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        SARIF_PATH: ${{ inputs.sarif }}
      run: |
        set +e
        "$RUNNER_TEMP/pii-eu" scan --format json --output "$RUNNER_TEMP/pii-eu.json" --min-confidence "$MIN_CONFIDENCE" "$SCAN_PATH"
        code=$?
        if [ "$code" -ge 2 ]; then
          "$RUNNER_TEMP/pii-eu" scan --min-confidence "$MIN_CONFIDENCE" "$SCAN_PATH"
          exit "$code"
        fi
        "$RUNNER_TEMP/pii-eu" scan --format github --min-confidence "$MIN_CONFIDENCE" "$SCAN_PATH"
        if [ -n "$SARIF_PATH" ]; then
          "$RUNNER_TEMP/pii-eu" scan --format sarif --output "$SARIF_PATH" --min-confidence "$MIN_CONFIDENCE" "$SCAN_PATH"
        fi
        findings=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["summary"]["findings"])' "$RUNNER_TEMP/pii-eu.json")
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 1 ] && [ "$FAIL_ON_FINDINGS" = "true" ]; then
          exit 1
        fi
        exit 0

branding:
  icon: shield
  color: blue
