# Example step for Bitbucket Pipelines that scans with ATO. Set ATO_VERSION to a release tag or commit
# (default: main). PII_EU_VERSION is deprecated and still read when ATO_VERSION is not set.
# Set ATO_LICENSE as a secured repository or workspace variable holding your license.
definitions:
  steps:
    - step: &ato
        name: ato
        image: golang:1.24
        script:
          - if [ -z "${ATO_VERSION:-}" ] && [ -n "${PII_EU_VERSION:-}" ]; then echo "ato: PII_EU_VERSION is deprecated; set ATO_VERSION" >&2; ATO_VERSION="$PII_EU_VERSION"; fi
          - export ATO_VERSION="${ATO_VERSION:-main}"
          - go install "github.com/Clause-Eight/ato/v2/cmd/ato@${ATO_VERSION}"
          - ato scan --format json --output ato.json . || code=$?
          - ato scan .
        artifacts:
          - ato.json

pipelines:
  pull-requests:
    "**":
      - step: *ato
  branches:
    main:
      - step: *ato
